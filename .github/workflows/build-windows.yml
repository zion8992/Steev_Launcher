name: Build Windows (Steev)

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Debug or Release
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  windows:
    name: Windows x64 (MinGW)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    env:
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      BUILD_PLATFORM: steev
      ARTIFACT_NAME: Windows-MinGW-w64-Qt6

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup MSYS2 + dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: >-
            toolchain:p cmake:p extra-cmake-modules:p ninja:p
            qt6-base:p qt6-svg:p qt6-imageformats:p qt6-networkauth:p
            cmark:p qrencode:p tomlplusplus:p libarchive:p

      - name: Configure
        run: >
          cmake --preset windows_mingw
          -DLauncher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}"

      - name: Build
        run: cmake --build --preset windows_mingw --config "$BUILD_TYPE"

      - name: Install (portable)
        run: |
          cmake --install build --config "$BUILD_TYPE"
          cmake --install build --config "$BUILD_TYPE" --component portable
          (cd install && find . -type f | sed 's|^\./||' > manifest.txt)

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path install\* -DestinationPath SteevLauncher-Windows-Portable.zip

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: SteevLauncher-Windows-Portable-${{ env.BUILD_TYPE }}
          path: SteevLauncher-Windows-Portable.zip
